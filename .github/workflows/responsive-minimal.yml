name: Ambassador responsive visual audit
# Frozen release: exact-commit Preview, isolated fixtures, three CSS viewports.
on:
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Also run the preserved complete audits'
        type: boolean
        default: false
  push:
    branches:
      - ambassador-final-uiux-20260927
    paths:
      - 'public/final-design.css'
      - 'public/workflow-polish.js'
      - 'public/breakfast-app-logo.svg'
      - '.github/scripts/**'
      - '.github/workflows/responsive-minimal.yml'
permissions:
  contents: read
  deployments: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frozen application
        id: scope
        run: |
          npm ci
          node .github/scripts/check-frozen-boundary.cjs
          npm run build
      - name: Install test-only browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for this commit's Vercel Preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/wait-for-preview.cjs
      - name: Audit iPhone, iPad and reception desktop
        if: steps.scope.outputs.branding_only != 'true' || inputs.full_regression == true
        run: node .github/scripts/responsive-audit.cjs
      - name: Targeted real-device findings in Chromium and WebKit
        if: steps.scope.outputs.branding_only != 'true' || inputs.full_regression == true
        run: node .github/scripts/realdevice-regression.cjs
      - name: Verify role chooser branding and direct navigation
        run: node .github/scripts/branding-regression.cjs
      - name: Upload screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-responsive-visual-audit
          path: responsive-audit-output/
          retention-days: 7
          if-no-files-found: warn
