name: Ambassador responsive visual audit
on:
  workflow_dispatch:
  push:
    branches:
      - ambassador-final-uiux-20260927
    paths:
      - '.github/workflows/responsive-minimal.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser
        run: |
          npm ci
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Audit unchanged deployed preview at both CSS viewports
        run: node .github/scripts/responsive-audit.cjs
      - name: Upload private screenshots and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambassador-responsive-visual-audit
          path: responsive-audit-output/
          retention-days: 7
          if-no-files-found: warn
